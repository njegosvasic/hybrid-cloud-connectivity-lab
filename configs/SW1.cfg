!
! SW1 - on-prem access switch (Cisco IOL L2 15.1)
! Role: flat Layer 2 access for the LAN, management on Vlan1, SSH management, SNMPv3 for Zabbix.
! Routing is deliberately disabled ("no ip routing") - R1 is the only L3 device.
!
! NOTE: enable secret and user secret hashes replaced with <REDACTED-FOR-PUBLIC-REPO>.
! NOTE: this IOL image only supports Type 4 secrets (no scrypt), see docs/design-decisions.md.
! NOTE: the SNMPv3 user (and its keys) is not shown in running-config by design.
! NOTE: empty "!" separator lines trimmed for readability.
!
version 15.1
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
service compress-config
!
hostname SW1
!
boot-start-marker
boot-end-marker
!
enable secret 4 <REDACTED-FOR-PUBLIC-REPO>
!
username admin privilege 15 secret 4 <REDACTED-FOR-PUBLIC-REPO>
no aaa new-model
no ip routing
!
no ip cef
!
no ip domain-lookup
ip domain-name lab.local
no ipv6 cef
ipv6 multicast rpf use-bgp
!
spanning-tree mode pvst
spanning-tree extend system-id
!
vlan internal allocation policy ascending
!
ip ssh version 2
!
interface Ethernet0/0
 description ## Uplink to R1 Gi0/1 ##
 switchport mode access
 duplex auto
!
interface Ethernet0/1
 description ## Host ports ##
 switchport mode access
 duplex auto
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface Ethernet0/2
 description ## Host ports ##
 switchport mode access
 duplex auto
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface Ethernet0/3
 description ## Zabbix server ##
 switchport mode access
 duplex auto
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface Vlan1
 description ## Management ##
 ip address 192.168.10.2 255.255.255.0
 no ip route-cache
!
ip default-gateway 192.168.10.1
!
no ip http server
!
ip access-list standard ACL-SNMP
 remark Allow SNMP polling from Zabbix server
 permit 192.168.10.30
!
snmp-server group ZBX-GROUP v3 priv read ZBX-VIEW access ACL-SNMP
snmp-server view ZBX-VIEW iso included
snmp-server location EVE-NG lab - on-prem site
snmp-server contact Njegos Vasic
snmp ifmib ifindex persist
!
control-plane
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 exec-timeout 15 0
 login local
 transport input ssh
!
end
