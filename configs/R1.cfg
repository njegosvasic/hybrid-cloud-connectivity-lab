!
! R1 - on-prem edge router (Cisco IOSv 15.9(3)M6)
! Role: WAN uplink via EVE-NG Cloud0 (DHCP), LAN gateway, PAT, SSH management.
! Phase 1 state - IPsec tunnel to Azure is added in Phase 3.
!
! NOTE: enable secret and user secret hashes replaced with <REDACTED-FOR-PUBLIC-REPO>.
! NOTE: three identical IOSv evaluation-license banners (exec/incoming/login) trimmed
!       for readability - boilerplate license text, not part of this lab's design.
!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
enable secret 9 <REDACTED-FOR-PUBLIC-REPO>
!
no aaa new-model
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
no ip domain lookup
ip domain name lab.local
ip name-server 8.8.8.8
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
username admin privilege 15 secret 9 <REDACTED-FOR-PUBLIC-REPO>
!
redundancy
!
interface GigabitEthernet0/0
 description ## WAN to Internet ##
 ip address dhcp
 ip nat outside
 ip virtual-reassembly in
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 description ## LAN 192.168.10.0 ##
 ip address 192.168.10.1 255.255.255.0
 ip nat inside
 ip virtual-reassembly in
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
ip nat inside source list ACL-NAT-INTERNET interface GigabitEthernet0/0 overload
ip ssh time-out 60
ip ssh version 2
!
ip access-list extended ACL-NAT-INTERNET
 remark Allow LAN to Internet (PAT on WAN interface)
 permit ip 192.168.10.0 0.0.0.255 any
!
ipv6 ioam timestamp
!
control-plane
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 exec-timeout 15 0
 login local
 transport input ssh
!
no scheduler allocate
!
end
